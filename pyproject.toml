[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudurl"
dynamic = ["version"]
description = "Fast, offline phishing-URL checker: CSV in, verdict + calibrated probability + plain-English reasons out"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND MPL-2.0"            # MIT for fraudurl; MPL-2.0 for the bundled Public Suffix List
license-files = ["LICENSE", "NOTICE.md", "LICENSES/*"]
authors = [{ name = "Amruthjithraj V.R" }]
keywords = ["phishing", "url", "fraud", "security", "classifier", "lightgbm", "offline", "csv", "threat-detection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
]
dependencies = []                      # every mode is pure standard library (DNS is resolved over HTTPS)

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/amruth112/fraudurl-detector"
Documentation = "https://github.com/amruth112/fraudurl-detector/blob/main/HOW_IT_WORKS.md"
Issues = "https://github.com/amruth112/fraudurl-detector/issues"
Changelog = "https://github.com/amruth112/fraudurl-detector/blob/main/CHANGELOG.md"

[project.scripts]
fraudurl = "fraudurl.cli:main"

[tool.setuptools]
packages = ["fraudurl"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "fraudurl.__version__" }

[tool.setuptools.package-data]
fraudurl = ["data/*.json", "data/*.dat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
