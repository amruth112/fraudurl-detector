dth="1.5"/><text x="672" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#59636e" text-anchor="start">plain http</text><rect x="761.0" y="187" width="14" height="14" rx="3" fill="#fff1c7" stroke="#e8a200" stroke-width="1.5"/><text x="781.0" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#59636e" text-anchor="start">brand / login words</text><rect x="930.3" y="187" width="14" height="14" rx="3" fill="#dcebfb" stroke="#2a78d6" stroke-width="1.5"/><text x="950.3" y="198" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="500" fill="#59636e" text-anchor="start">the real owner's domain</text><line x1="652" y1="218" x2="1124" y2="218" stroke="#d0d7de"/><rect x="652" y="236" width="83.2" height="34" rx="17.0" fill="#d03b3b"/><text x="693.6" y="258.76" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">FRAUD</text><text x="747.2" y="261" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="24" font-weight="700" fill="#1f2328" text-anchor="start">0.998</text><text x="821.2" y="259" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#818b98" text-anchor="start">probability of phishing</text><circle cx="658" cy="292" r="3" fill="#d03b3b"/><text x="670" y="296" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">well-known brand name in the subdomain (impersonation pattern)</text><circle cx="658" cy="316" r="3" fill="#d03b3b"/><text x="670" y="320" 