<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="148" viewBox="0 0 1200 148" role="img" aria-label="fraudurl in numbers"><title>fraudurl in numbers</title><rect x="0.5" y="0.5" width="287.0" height="147" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="24.0" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#1f2328" text-anchor="start" letter-spacing="-1">6 min 20 s</text><text x="24.0" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">to check 1,000,000 URLs</text><text x="24.0" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">on a 4-core desktop</text><rect x="304.5" y="0.5" width="287.0" height="147" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="328.0" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#1f2328" text-anchor="start" letter-spacing="-1">450 KB</text><text x="328.0" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">the whole tool in one file,</text><text x="328.0" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">models included</text><rect x="608.5" y="0.5" width="287.0" height="147" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="632.0" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#1f2328" text-anchor="start" letter-spacing="-1">0</text><text x="632.0" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">dependencies: Python 3.9+</text><text x="632.0" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">standard library only</text><rect x="912.5" y="0.5" width="287.0" height="147" rx="14" fill="#ffffff" stroke="#d0d7de"/><text x="936.0" y="62" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="40" font-weight="800" fill="#1f2328" text-anchor="start" letter-spacing="-1">0.91–0.98</text><text x="936.0" y="96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">ROC-AUC on domains never</text><text x="936.0" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">seen in training (2020–2026)</text></svg>
